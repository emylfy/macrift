# git-cliff config — used by .githooks/pre-push to render the body for a
# GitHub Release from conventional commits. Optional: if git-cliff isn't on
# PATH the hook falls back to a plain "Release v<VERSION>" body.
# There is deliberately no tracked CHANGELOG.md — release notes live on the
# GitHub Releases page and in the in-app update changelog.

[changelog]
# Single header line; per-version sections are emitted by the body template.
header = """
# Changelog

All notable changes to **macrift** since the plugin-platform pivot. Format
follows the spirit of [Keep a Changelog](https://keepachangelog.com/) but
the content is generated automatically from
[Conventional Commits](https://www.conventionalcommits.org/).

"""

# Version section. {{ version }} is supplied via --tag at hook-time, so this
# template works whether the tag already exists or not (it's about to).
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group, items in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for c in items %}- {{ c.message | split(pat="\n") | first | trim }}{% if c.breaking %} ⚠ BREAKING{% endif %}
{% endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true     # only consider conventional commits
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Two- or three-component calver: monthly tags are vYY.MM, patches vYY.MM.N.
tag_pattern = "v[0-9]+\\.[0-9]+(\\.[0-9]+)?"
sort_commits = "newest"
topo_order = false

# Map conventional-commit `type` → human-readable section.
commit_parsers = [
    { message = "^feat",                group = "Features" },
    { message = "^fix",                 group = "Bug fixes" },
    { message = "^perf",                group = "Performance" },
    { message = "^docs",                group = "Documentation" },
    { message = "^refactor",            group = "Refactoring" },
    { message = "^test",                group = "Tests" },
    { message = "^chore\\(release\\)",  skip  = true },
    { message = "^chore\\(deps\\)",     group = "Dependencies" },
    { message = "^chore",               group = "Chore" },
    { message = "^style",               group = "Style" },
    { message = "^ci",                  group = "CI" },
    { message = "^build",               group = "Build" },
    # Anything else conventional but not parsed above goes into Misc.
    { message = ".*",                   group = "Misc" },
]
