# macrift — tmux config
# Plugins are managed by TPM: https://github.com/tmux-plugins/tpm
source-file ~/.config/tmux/tmux.reset.conf

# Terminal / true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Prefix — default C-b (every tmux tutorial assumes it).
# Prefer C-a? Uncomment the next two lines.
# unbind C-b
# set -g prefix C-a

# Sane defaults
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1        # panes start at 1
set -g renumber-windows on       # renumber windows when one closes
set -g detach-on-destroy off     # stay in tmux when the last window closes
set -g escape-time 0             # no delay after Esc (matters in Vim)
set -g history-limit 1000000     # big scrollback
set -g set-clipboard on          # use the system clipboard
set -g mouse on                  # select panes, resize, scroll with the mouse
set -g status-position top       # macOS-style: status bar on top
setw -g mode-keys vi             # vi keys in copy mode

# Pane borders
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Plugins — press <prefix> + I to install (or use macrift's "Install plugins")
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions manually
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto save/restore across reboots

# Persistence — the main reason to use tmux: sessions survive a reboot
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Status bar — Catppuccin Mocha palette via built-in options (no theme plugin,
# so nothing to break on plugin API changes). Swap in catppuccin/tmux if wanted.
set -g status-style 'bg=default,fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#a6adc8]#{b:pane_current_path} #[fg=#89b4fa]%H:%M '
set -g window-status-format '#[fg=#6c7086] #I #W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W '
set -g window-status-separator ''

# Initialize TPM — keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
