# macrift — tmux key bindings (sourced first by tmux.conf)

# Splits — open in the current pane's directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resize (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation (repeatable)
bind -r n next-window
bind -r p previous-window

# Zoom the current pane / reload config
bind z resize-pane -Z
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Copy mode (vi): v to select, y to yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
