name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug — what you expected vs what actually happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run macrift
        2. Go to ...
        3. Select ...
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. 15.4 Sequoia
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: Apple Silicon (arm64) or Intel (x86_64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output / logs
      description: Paste any relevant error output
      render: shell
